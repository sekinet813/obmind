name: obmind
description: "Markdownを正本とする、Local-firstなマインドマップアプリ。"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#F5F0E6"
  adaptive_icon_foreground: assets/brand/app_icon.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/app_icon.png
